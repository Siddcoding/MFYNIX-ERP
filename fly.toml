# Fly.io configuration. Deploy with:
#     fly launch --no-deploy      # creates the app, keep this file when asked
#     fly volumes create mfintech_data --size 1 --region sin
#     fly secrets set JWT_SECRET="$(openssl rand -hex 32)"
#     fly deploy
#
# The volume is the important part: without it the SQLite file lives inside the
# machine's ephemeral disk and is lost on every deploy.

app = "mfintech-erp"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_PATH = "/data/mfintech.db"

[[mounts]]
  source = "mfintech_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false      # SQLite writes badly if the machine sleeps mid-transaction
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response.headers]
    X-Frame-Options = "SAMEORIGIN"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/api/health"

# One machine only. Two machines would each open their own copy of the SQLite
# file on their own volume and the company's data would silently fork in half.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
