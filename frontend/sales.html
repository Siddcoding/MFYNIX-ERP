<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sales - Mfynix</title>
<link rel="icon" type="image/png" href="img/favicon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script src="js/common.js"></script>
<script>Auth.requireLogin(); renderShell('sales');</script>

<template id="tpl">
  <div class="card">
    <h2>New Sales Invoice</h2>
    <form id="salesForm">
      <div class="form-grid">
        <div id="branchSelectWrap" style="display:none;">
          <label>Branch *</label>
          <select name="branchId" id="branchSelect"></select>
        </div>
        <div>
          <label>Customer *</label>
          <select name="customerId" id="customerSelect" required></select>
        </div>
        <div>
          <label>Invoice Date *</label>
          <input type="date" name="invoiceDate" id="invoiceDate" required />
        </div>
      </div>
      <div class="form-grid" style="margin-top:12px;">
        <div>
          <label>Payment Term</label>
          <select name="paymentTermId" id="paymentTermSelect"><option value="">Customer default</option></select>
        </div>
        <div>
          <label>Payment Mode</label>
          <select name="paymentMode" id="paymentModeSelect">
            <option value="">Credit (on account)</option>
            <option value="Cash">Cash (counter sale)</option>
            <option value="UPI">UPI (counter sale)</option>
            <option value="Card">Card (counter sale)</option>
            <option value="Bank">Bank (counter sale)</option>
          </select>
        </div>
        <div><label>Freight</label><input name="freight" type="number" step="0.01" min="0" placeholder="0" /></div>
        <div><label>Other Charges</label><input name="otherCharges" type="number" step="0.01" min="0" placeholder="0" /></div>
        <div>
          <label>Round Off</label>
          <label style="font-weight:400;font-size:0.85rem;"><input type="checkbox" name="autoRound" id="autoRound" /> round net to nearest rupee</label>
        </div>
      </div>
      <div id="docExtrasSlot"></div>

      <h3 style="margin:16px 0 8px;font-size:0.9rem;">Line Items</h3>
      <div id="lineItems"></div>
      <button type="button" class="btn secondary" id="addLineBtn" style="margin-top:8px;">+ Add Item</button>

      <div style="margin-top:16px;font-weight:600;">Net Amount: <span id="netAmountPreview">₹0</span></div>
      <div id="salesError" class="error-text" style="display:none;"></div>
      <div style="margin-top:14px;display:flex;gap:10px;">
        <button class="btn" type="submit" id="postBtn">Save &amp; Post Invoice</button>
        <button class="btn secondary" type="submit" id="draftBtn">Save as Draft</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Invoices</h2>
    <div class="filter-bar">
      <div><label>Search</label><input id="fSearch" placeholder="Invoice no or customer" /></div>
      <div><label>From</label><input id="fFrom" type="date" /></div>
      <div><label>To</label><input id="fTo" type="date" /></div>
      <div><label>Status</label><select id="fStatus"><option value="">All</option><option>Posted</option><option>Cancelled</option></select></div>
      <div><button class="btn secondary" id="fClear">Clear</button></div>
    </div>
    <div id="invoiceList"></div>
    <div id="invoicePager"></div>
  </div>
</template>

<script>
(async function () {
  const content = document.getElementById('page-content');
  content.appendChild(document.getElementById('tpl').content.cloneNode(true));

  // The statutory reference/transport block, shared by every document type.
  document.getElementById('docExtrasSlot').innerHTML = documentExtrasHtml();
  initDocumentExtras();
  const user = Auth.getUser();
  // Read Only and Auditor can view and print but never reverse a document.
  const canCancel = !['Read Only', 'Auditor'].includes(user.role);
  document.getElementById('invoiceDate').valueAsDate = new Date();

  // Payment terms for the dropdown (MD-05/06).
  try {
    const terms = await api('/masters/payment-terms');
    const sel = document.getElementById('paymentTermSelect');
    terms.forEach(t => {
      const o = document.createElement('option');
      o.value = t.PaymentTermID;
      o.textContent = `${t.Code} — ${t.Description || t.NetDays + ' days'}`;
      sel.appendChild(o);
    });
  } catch (e) { /* terms are optional */ }

  let items = [];
  let customers = [];

  async function loadRefData() {
    items = await api('/masters/items');
    customers = await api('/masters/customers');

    document.getElementById('customerSelect').innerHTML =
      customers.map(c => `<option value="${esc(c.CustomerID)}">${esc(c.CustomerName)}</option>`).join('') ||
      '<option value="">No customers - add one under Masters</option>';

    if (!user.branchId) {
      const branches = await api('/branches');
      document.getElementById('branchSelectWrap').style.display = 'block';
      document.getElementById('branchSelect').innerHTML =
        branches.map(b => `<option value="${esc(b.BranchID)}">${esc(b.BranchName)} (${esc(b.BranchCode)})</option>`).join('');
    }
  }

  function itemOptions() {
    return items.map(i => `<option value="${esc(i.ItemID)}" data-rate="${esc(i.SaleRate)}" data-gst="${esc(i.GSTRate)}">${esc(i.ItemName)}</option>`).join('');
  }

  function addLine() {
    const row = el(`
      <div class="form-grid line-row" style="margin-bottom:8px;align-items:end;">
        <div><label>Item</label><select class="li-item">${itemOptions()}</select></div>
        <div><label>Qty</label><input class="li-qty" type="number" step="0.01" value="1" /></div>
        <div><label>Rate</label><input class="li-rate" type="number" step="0.01" value="0" /></div>
        <div><label>Discount</label><input class="li-discount" type="number" step="0.01" value="0" /></div>
        <div><label>GST %</label><input class="li-gst" type="number" step="0.01" value="0" /></div>
        <div><button type="button" class="btn secondary remove-line">Remove</button></div>
      </div>
    `);
    document.getElementById('lineItems').appendChild(row);

    const itemSelect = row.querySelector('.li-item');
    const rateInput = row.querySelector('.li-rate');
    const gstInput = row.querySelector('.li-gst');
    function syncFromItem() {
      const opt = itemSelect.selectedOptions[0];
      if (opt) { rateInput.value = opt.dataset.rate || 0; gstInput.value = opt.dataset.gst || 0; }
      recalcTotal();
    }
    itemSelect.addEventListener('change', syncFromItem);
    row.querySelectorAll('input').forEach(inp => inp.addEventListener('input', recalcTotal));
    row.querySelector('.remove-line').addEventListener('click', () => { row.remove(); recalcTotal(); });
    syncFromItem();
  }

  function recalcTotal() {
    let net = 0;
    document.querySelectorAll('.line-row').forEach(row => {
      const qty = Number(row.querySelector('.li-qty').value || 0);
      const rate = Number(row.querySelector('.li-rate').value || 0);
      const discount = Number(row.querySelector('.li-discount').value || 0);
      const gst = Number(row.querySelector('.li-gst').value || 0);
      const base = qty * rate - discount;
      net += base + base * (gst / 100);
    });
    document.getElementById('netAmountPreview').textContent = fmtMoney(net);
  }

  function collectLines() {
    return [...document.querySelectorAll('.line-row')].map(row => ({
      itemId: Number(row.querySelector('.li-item').value),
      qty: Number(row.querySelector('.li-qty').value),
      rate: Number(row.querySelector('.li-rate').value),
      discount: Number(row.querySelector('.li-discount').value),
      gst: Number(row.querySelector('.li-gst').value)
    })).filter(l => l.itemId && l.qty > 0);
  }

  document.getElementById('addLineBtn').addEventListener('click', addLine);

  document.getElementById('salesForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('salesError');
    errBox.style.display = 'none';
    const fd = new FormData(e.target);
    const body = {
      customerId: Number(fd.get('customerId')),
      invoiceDate: fd.get('invoiceDate'),
      ...collectDocumentExtras(e.target),
      branchId: fd.get('branchId') ? Number(fd.get('branchId')) : undefined,
      paymentTermId: fd.get('paymentTermId') ? Number(fd.get('paymentTermId')) : undefined,
      paymentMode: fd.get('paymentMode') || undefined,
      freight: fd.get('freight') ? Number(fd.get('freight')) : undefined,
      otherCharges: fd.get('otherCharges') ? Number(fd.get('otherCharges')) : undefined,
      autoRound: !!fd.get('autoRound'),
      saveAsDraft: e.submitter && e.submitter.id === 'draftBtn',
      items: collectLines()
    };
    if (body.items.length === 0) {
      errBox.textContent = 'Add at least one valid line item.';
      errBox.style.display = 'block';
      toast('Add at least one valid line item.', 'error');
      return;
    }
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalLabel = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="spinner"></span>Saving...`;
    try {
      const result = await api('/sales', { method: 'POST', body });
      const what = result.status === 'Draft' ? 'Draft' : 'Invoice';
      showSuccessBurst(`${what} ${esc(result.invoiceNo)} saved`);
      toast(`${what} ${esc(result.invoiceNo)} saved — net amount ${fmtMoney(result.netAmount)}${result.status === 'Draft' ? ' (not yet posted)' : ''}`, 'success');
      document.getElementById('lineItems').innerHTML = '';
      addLine();
      recalcTotal();
      await loadInvoices();
    } catch (err) {
      errBox.textContent = err.message;
      errBox.style.display = 'block';
      toast(err.message, 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalLabel;
    }
  });

  let invoicePage = 1;

  async function loadInvoices(page) {
    if (page) invoicePage = page;
    const branchId = document.getElementById('branchSelect')?.value;
    const result = await api('/sales', { params: {
      branchId, page: invoicePage,
      search: document.getElementById('fSearch').value,
      from: document.getElementById('fFrom').value,
      to: document.getElementById('fTo').value,
      status: document.getElementById('fStatus').value
    } });
    const rows = rowsOf(result);
    const target = document.getElementById('invoiceList');
    renderPager(document.getElementById('invoicePager'), result, (n) => loadInvoices(n));
    if (rows.length === 0) { target.innerHTML = '<p class="muted">No invoices match these filters.</p>'; return; }
    target.innerHTML = `
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Invoice No</th><th>Branch</th><th>Customer</th><th>Date</th><th style="text-align:right;">Net Amount</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr${r.Status === 'Cancelled' ? ' style="opacity:0.55;"' : ''}>
            <td>${esc(r.InvoiceNo)}</td><td>${esc(r.BranchName)}</td><td>${esc(r.CustomerName)}</td>
            <td>${fmtDate(r.InvoiceDate)}</td><td style="text-align:right;">${fmtMoney(r.NetAmount)}</td>
            <td>${r.Status === 'Cancelled' ? '<span class="badge warn">Cancelled</span>' : '<span class="badge ok">Posted</span>'}</td>
            <td style="white-space:nowrap;">
              <button class="btn secondary" data-print="${esc(r.InvoiceID)}" style="padding:6px 12px;">Print</button>
              ${r.Status !== 'Cancelled' && canCancel ? `<button class="btn secondary" data-cancel="${esc(r.InvoiceID)}" data-no="${esc(r.InvoiceNo)}" style="padding:6px 12px;">Cancel</button>` : ''}
            </td>
          </tr>`).join('')}
        </tbody>
      </table></div>`;

    target.querySelectorAll('[data-print]').forEach(b =>
      b.addEventListener('click', () => window.open(`/print.html?type=sales&id=${b.dataset.print}`, '_blank')));
    target.querySelectorAll('[data-cancel]').forEach(b =>
      b.addEventListener('click', () => promptCancel(b.dataset.cancel, b.dataset.no)));
  }

  // Cancelling reverses the invoice rather than deleting it, so the reason is
  // mandatory - it ends up on the reversal's narration and in the audit log.
  function promptCancel(invoiceId, invoiceNo) {
    const modal = openModal(`Cancel invoice ${invoiceNo}`, `
      <p class="muted">The invoice is not deleted. Its stock movement and accounting entry are reversed with matching
      opposite entries, and the invoice number stays permanently used — which is what GST rules require.</p>
      <label>Reason *</label>
      <input id="cancelReason" placeholder="e.g. Raised against the wrong customer" />
      <div id="cancelError" class="error-text" style="display:none;"></div>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn" id="cancelConfirm" data-loading-text="Cancelling…">Cancel this invoice</button>
        <button class="btn secondary" id="cancelDismiss">Keep it</button>
      </div>`);
    modal.querySelector('#cancelDismiss').addEventListener('click', closeModal);
    const go = modal.querySelector('#cancelConfirm');
    go.addEventListener('click', withLoading(go, async () => {
      const errBox = modal.querySelector('#cancelError');
      errBox.style.display = 'none';
      try {
        await api(`/sales/${invoiceId}/cancel`, { method: 'POST', body: { reason: modal.querySelector('#cancelReason').value } });
        closeModal();
        toast(`Invoice ${invoiceNo} cancelled and reversed`, 'success');
        await loadInvoices();
      } catch (e) {
        errBox.textContent = e.message;
        errBox.style.display = 'block';
      }
    }));
  }

  ['fSearch', 'fFrom', 'fTo', 'fStatus'].forEach(id => {
    const node = document.getElementById(id);
    const evt = node.tagName === 'SELECT' || node.type === 'date' ? 'change' : 'input';
    let t;
    node.addEventListener(evt, () => { clearTimeout(t); t = setTimeout(() => loadInvoices(1), 250); });
  });
  document.getElementById('fClear').addEventListener('click', () => {
    ['fSearch', 'fFrom', 'fTo'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('fStatus').value = '';
    loadInvoices(1);
  });

  await loadRefData();
  addLine();
  await loadInvoices();
  attachHoverEffects();
})();
</script>
</body>
</html>
