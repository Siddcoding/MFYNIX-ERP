<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - Mfynix</title>
<link rel="icon" type="image/png" href="img/favicon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-row"><span class="logo-dot"></span><h1 id="cardTitle">Reset Password</h1></div>
      <p class="sub" id="cardSub">Enter your username and we'll generate a reset token.</p>

      <!-- Step 1: request token -->
      <form id="requestForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" placeholder="e.g. admin" required />
        </div>
        <button class="btn" type="submit" id="requestBtn">Email me a reset code</button>
      </form>

      <!-- Step 2: enter token + new password (hidden until token is issued) -->
      <form id="resetForm" style="display:none;">
        <div class="field">
          <label for="token">Reset code from your email</label>
          <input id="token" name="token" placeholder="Paste the code" required />
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" placeholder="At least 8 characters" required minlength="8" />
        </div>
        <button class="btn" type="submit" id="resetBtn">Reset password</button>
      </form>

            <a href="index.html" class="back-link">&larr; Back to login</a>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    initAuroraBackground();
    const requestForm = document.getElementById('requestForm');
    const resetForm = document.getElementById('resetForm');
    const requestBtn = document.getElementById('requestBtn');
    const resetBtn = document.getElementById('resetBtn');
        let rememberedUsername = '';
    // Opened from the emailed link: username and code arrive in the URL.
    (function () {
      const qs = new URLSearchParams(window.location.search);
      if (qs.get('u') && qs.get('t')) {
        rememberedUsername = qs.get('u');
        document.getElementById('token').value = qs.get('t');
        requestForm.style.display = 'none';
        resetForm.style.display = 'block';
        document.getElementById('cardSub').textContent = 'Choose a new password for "' + rememberedUsername + '".';
        history.replaceState(null, '', 'forgot-password.html');   // keep the code out of history/referrers
      }
    })();

    requestForm.addEventListener('submit', (e) => {
      e.preventDefault();
      withLoading(requestBtn, async () => {
        const username = document.getElementById('username').value.trim();
        try {
          const data = await api('/auth/forgot-password', { method: 'POST', body: { username } });
          rememberedUsername = username;
          toast(data.message, 'success');

          requestForm.style.display = 'none';
          resetForm.style.display = 'block';
          document.getElementById('cardSub').textContent = `If "${esc(username)}" has an email address on file, a code has been sent to it. Enter it below and choose a new password.`;
        } catch (err) {
          toast(err.message, 'error');
        }
      })();
    });

    resetForm.addEventListener('submit', (e) => {
      e.preventDefault();
      withLoading(resetBtn, async () => {
        const token = document.getElementById('token').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        try {
          const data = await api('/auth/reset-password', {
            method: 'POST',
            body: { username: rememberedUsername, token, newPassword }
          });
          toast(data.message, 'success', 2500);
          setTimeout(() => { window.location.href = 'index.html'; }, 900);
        } catch (err) {
          toast(err.message, 'error');
        }
      })();
    });
  </script>
</body>
</html>
